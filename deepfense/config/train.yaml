exp_name: "Wav2Vec2_Nes2Net_Example"
output_dir: "./outputs/"
seed: 42

data:
  sampling_rate: 16000
  label_map: {"bonafide": 1, "spoof": 0}

  train:
    dataset_type: "StandardDataset"
    dataset_names: ["ASVSpoof19"]
    parquet_files:
      - "./tests/test.parquet"    # Replace with your train parquet
    batch_size: 10
    shuffle: True
    base_transform:
      - type: "pad"
        max_len: 64600              # ~4 seconds at 16kHz
        random_pad: False
        pad_type: "repeat"

  val:
    dataset_type: "StandardDataset"
    dataset_names: ["ASVSpoof19"]
    parquet_files:
      - "./tests/test.parquet"    # Replace with your val parquet
    batch_size: 1
    base_transform:
      - type: "pad"
        max_len: 64600
        random_pad: False
        pad_type: "repeat"

  test:
    dataset_type: "StandardDataset"
    dataset_names: ["ASVSpoof19"]
    parquet_files:
      - "./tests/test.parquet"    # Replace with your test parquet

model:
  type: "StandardDetector"

  frontend:
    type: "wav2vec2"
    args:
      source: "huggingface"
      ckpt_path: "facebook/wav2vec2-xls-r-300m"  # HuggingFace model ID

  backend:
    type: "Nes2Net"
    args:
      input_dim: 1024
      pool: mean

  loss:
    - type: "CrossEntropy"
      weight: 0.5
      embedding_dim: 1024
      n_classes: 2
      class_weights: [0.1, 0.9]

    - type: "AMSoftmax"
      weight: 0.5
      embedding_dim: 1024
      n_classes: 2
      s: 30.0
      m: 0.4

training:
  trainer: "StandardTrainer"
  epochs: 10
  device: "cuda"
  num_workers: 4
  batch_log_interval: 10
  eval_every_steps: 1
  monitor_metric: "EER"
  monitor_mode: "min"
  output_dir: "./outputs/"

  optimizer:
    type: "adam"
    lr: 0.000001
    weight_decay: 0.0001

  scheduler:
    type: "exponential"
    gamma: 0.9

  metrics:
    ACC: {}
    F1_SCORE: {}
    EER: {}
    minDCF:
      Pspoof: 0.05
      Cmiss: 1
      Cfa: 1
