exp_name : "W2V_AASIST_SFLoss"
output_dir: "./outputs/"
seed: 1234

data:
  sampling_rate: 16000
  label_map: {"bonafide": 1, "spoof": 0}

  train:
    batch_size: 24
    dataset_type: "StandardDataset"
    dataset_names: ["ASVSpoof19"]
    parquet_files: [
      "/ds-slt/audio/adas/deepfense-framework/parquets/ASVspoof2019_LA_train.parquet",
      ]

    base_transform:
      - type: "pad"
        max_len: 64600
        random_pad: False
        pad_type: "repeat"

    augment_transform:
      - type: "simple_aug"
        noise_ratio: 6


  val:
    batch_size: 24
    dataset_type: "StandardDataset"
    dataset_names: ["ASVSpoof19"]
    parquet_files: [
      "/ds-slt/audio/adas/deepfense-framework/parquets/ASVspoof2019_LA_dev.parquet",
      ]

    base_transform:
      - type: "pad"
        max_len: 64600
        random_pad: False
        pad_type: "repeat"

  test:
    batch_size: 24
    dataset_type: "StandardDataset"
    dataset_names: ["ASVSpoof19"]
    parquet_files: [
      "/ds-slt/audio/adas/deepfense-framework/parquets/ASVspoof2019_LA_eval.parquet",
      ]

    base_transform:
      - type: "pad"
        max_len: 64600
        random_pad: False
        pad_type: "repeat"

detector:
  type: "StandardDetector"

  frontend:
    type: "wav2vec2"
    args:
      ckpt_path: "/netscratch/adas/Projects/deepfense-framework/deepfense/models/pretrained/xlsr2_300m.pt"

  backend:
    type: "AASIST"
    args:
      filts: [128, [1, 32], [32, 32], [32, 64], [64, 64]]
      gat_dims: [64, 32]
      pool_ratios: [0.5, 0.5, 0.5, 0.5]
      temperatures: [2.0, 2.0, 100.0, 100.0]


loss:
  - # --- Loss 1: Cross Entropy ---
    type: "SFSoftmax"
    weight: 0.5
    margin: 2
    scale: 30
    embedding_dim: 160
    n_classes: 2
    class_weights: [0.1, 0.9]

optimizer_config:
  type: "adam"
  params:
    lr: 0.000001
    weight_decay: 0.0001

scheduler_config:
  type: "exponential"
  params:
    gamma: 0.9

metrics:
  ACC: {}
  F1_SCORE: {}
  EER: {}
  EER_CI: {}
  actDCF:
    Pspoof: 0.05
    Cmiss: 1
    Cfa: 1
  minDCF:
    Pspoof: 0.05
    Cmiss: 1
    Cfa: 1

trainer:
  type: "StandardTrainer"
  config_type: "StandardConfig"
  params:
    epochs: 10
    device: "cuda"
    batch_size: 24
    num_workers: 2
    monitor_metric: "EER"