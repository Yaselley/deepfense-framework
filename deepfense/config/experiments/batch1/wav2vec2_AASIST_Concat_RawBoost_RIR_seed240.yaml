exp_name: wav2vec2_AASIST_Concat_RawBoost_RIR_seed240
output_dir: ./outputs/batch1/
seed: 240
data:
  sampling_rate: 16000
  label_map: {bonafide: 1, spoof: 0}
  train:
    dataset_type: StandardDataset
    parquet_files: [/ds-slt/audio/adas/deepfense-framework/parquets/ASVspoof2019_LA_train.parquet]
    dataset_names: [ASVSpoof19_Train]
    batch_size: 32
    shuffle: true
    num_workers: 2
    base_transform:
    - {type: pad, max_len: 64000, random_pad: true, pad_type: repeat}
    augment_transform:
    - type: augmentation_pipeline
      mode: sequential
      execution: independent
      p: 1.0
      concat_original: true
      transforms:
      - {type: rawboost, noise_ratio: 1.0, algo: 3}
      - {type: rir, noise_ratio: 1.0, csv_file: "/netscratch/adas/Projects/deepfense-framework/deepfense/config/augmentations/rir_arnab.csv"}
  val:
    dataset_type: StandardDataset
    parquet_files: [/ds-slt/audio/adas/deepfense-framework/parquets/ASVspoof2019_LA_dev.parquet]
    dataset_names: [ASVSpoof19_Val]
    batch_size: 32
    shuffle: false
    num_workers: 8
    base_transform:
    - {type: pad, max_len: 64000, pad_type: repeat}
  test:
    dataset_type: StandardDataset
    parquet_files: [ /netscratch/adas/Projects/deepfense-framework/deepfense/config/parquets/ASV21/asvspoof21_df_eval.parquet ]
    dataset_names: [ ASVSpoof21_df_Eval ]
    batch_size: 32
    shuffle: false
    num_workers: 7
    base_transform:
      - { type: pad, max_len: 64000, pad_type: repeat }
model:
  type: StandardDetector
  frontend:
    type: wav2vec2
    args: {ckpt_path: /netscratch/adas/Projects/deepfense-framework/deepfense/models/pretrained/xlsr2_300m.pt,
      freeze: false, source: fairseq}
  backend: {type: AASIST}
  loss:
  - {type: CrossEntropy, embedding_dim: 160, n_classes: 2, weight: 1.0}
training:
  trainer: StandardTrainer
  epochs: 100
  early_stopping_patience: 7
  optimizer: {type: adam, lr: 1.0e-06}
  metrics:
    ACC: {}
    EER: {}
    F1_SCORE: {}
    EER_CI: {}
  eval_every_epochs: 1
  device: cuda
