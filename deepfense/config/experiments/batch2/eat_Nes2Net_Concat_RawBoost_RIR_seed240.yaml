exp_name: eat_Nes2Net_Concat_RawBoost_RIR_seed240
output_dir: ./outputs/batch2/
seed: 240
data:
  sampling_rate: 16000
  label_map: {bonafide: 1, spoof: 0}
  train:
    dataset_type: StandardDataset
    parquet_files: [/netscratch/yelkheir/DeepFense/DeepFense/deepfense/config/parquets/asvspoof19_train.parquet]
    dataset_names: [ASVSpoof19_Train]
    batch_size: 32
    shuffle: true
    num_workers: 4
    base_transform:
    - {type: pad, max_len: 64000, random_pad: true, pad_type: repeat}
    augment_transform:
    - type: augmentation_pipeline
      mode: sequential
      execution: independent
      p: 1.0
      concat_original: true
      transforms:
      - {type: rawboost, noise_ratio: 1.0, algo: 3}
      - {type: rir, noise_ratio: 1.0, csv_file: /netscratch/yelkheir/DeepFense/DeepFense/deepfense/config/augmentations/rir.csv}
  val:
    dataset_type: StandardDataset
    parquet_files: [/netscratch/yelkheir/DeepFense/DeepFense/deepfense/config/parquets/asvspoof19_val.parquet]
    dataset_names: [ASVSpoof19_Val]
    batch_size: 32
    shuffle: false
    num_workers: 4
    base_transform:
    - {type: pad, max_len: 64000, pad_type: repeat}
model:
  type: StandardDetector
  frontend:
    type: eat
    args: {source: huggingface}
  backend: {type: Nes2Net}
  loss:
  - {type: CrossEntropy, embedding_dim: 1024, n_classes: 2, weight: 1.0}
training:
  trainer: StandardTrainer
  epochs: 100
  early_stopping_patience: 7
  optimizer: {type: adam, lr: 1.0e-06}
  metrics:
    ACC: {}
    EER: {}
  eval_every_epochs: 1
  device: cuda
