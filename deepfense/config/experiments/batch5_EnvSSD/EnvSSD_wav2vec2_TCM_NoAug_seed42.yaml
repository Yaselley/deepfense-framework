exp_name: EnvSSD_wav2vec2_TCM_NoAug_seed42
output_dir: ./outputs/batch5_EnvSSD/
seed: 42
data:
  sampling_rate: 16000
  label_map: {bonafide: 1, spoof: 0}
  train:
    dataset_type: StandardDataset
    parquet_files: [/netscratch/yelkheir/DeepFense/DeepFense/deepfense/config/parquets/EnvSSD/envssd_train.parquet]
    dataset_names: [EnvSSD_Train]
    batch_size: 32
    shuffle: true
    num_workers: 4
    base_transform:
    - {type: pad, max_len: 64000, random_pad: true, pad_type: repeat}
    augment_transform: []
  val:
    dataset_type: StandardDataset
    parquet_files: [/netscratch/yelkheir/DeepFense/DeepFense/deepfense/config/parquets/EnvSSD/envssd_val.parquet]
    dataset_names: [EnvSSD_Val]
    batch_size: 32
    shuffle: false
    num_workers: 4
    base_transform:
    - {type: pad, max_len: 64000, pad_type: repeat}
model:
  type: StandardDetector
  frontend:
    type: wav2vec2
    args: {ckpt_path: /netscratch/yelkheir/ssl_models/xlsr2_300m.pt, freeze: false,
      source: fairseq}
  backend:
    type: TCM
    args: {emb_size: 128, heads: 4, num_encoders: 1}
  loss:
  - {type: CrossEntropy, embedding_dim: 128, n_classes: 2, weight: 1.0}
training:
  trainer: StandardTrainer
  epochs: 100
  early_stopping_patience: 7
  optimizer: {type: adam, lr: 1.0e-06}
  metrics:
    ACC: {}
    EER: {}
  eval_every_epochs: 1
  device: cuda
