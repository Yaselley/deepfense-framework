exp_name: FakeMusicCaps_eat_AASIST_NoAug_seed2
output_dir: ./outputs/FakeMusicCaps/
seed: 2
data:
  target_sr: 16000
  label_map: {bonafide: 1, spoof: 0}
  train:
    dataset_type: StandardDataset
    parquet_files: [/netscratch/yelkheir/DeepFense/DeepFense/deepfense/config/parquets/FakeMusicCaps/fakemusiccaps_train.parquet]
    dataset_names: [FakeMusicCaps_Train]
    batch_size: 16
    shuffle: true
    num_workers: 4
    base_transform:
    - {type: pad, max_len: 64000, random_pad: true, pad_type: repeat}
    augment_transform: []
  val:
    dataset_type: StandardDataset
    parquet_files: [/netscratch/yelkheir/DeepFense/DeepFense/deepfense/config/parquets/FakeMusicCaps/fakemusiccaps_dev.parquet]
    dataset_names: [FakeMusicCaps_Dev]
    batch_size: 16
    shuffle: false
    num_workers: 4
    base_transform:
    - {type: pad, max_len: 64000, pad_type: repeat}
model:
  type: StandardDetector
  frontend:
    type: eat
    args: {source: huggingface}
  backend: {type: AASIST}
  loss:
  - {type: CrossEntropy, embedding_dim: 160, n_classes: 2, weight: 1.0}
training:
  trainer: StandardTrainer
  epochs: 100
  early_stopping_patience: 7
  optimizer: {type: adam, lr: 1.0e-06}
  metrics:
    ACC: {}
    EER: {}
  eval_every_epochs: 1
  device: cuda
