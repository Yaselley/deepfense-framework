site_name: DeepFense Framework
site_description: A modular, configuration-driven framework for Deepfake Audio Detection.
site_author: DeepFense Team
site_url: https://deepfense.github.io/

repo_url: https://github.com/Yaselley/deepfense-framework
repo_name: deepfense-framework
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  logo: logo/logo.png
  favicon: logo/logo.png
  highlightjs: true
  hljs_languages:
    - yaml
    - python
    - bash

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - 01 Installation: 01_installation.md
  - 02 Quick Start: 02_quickstart.md
  - 03 Full Tutorial: 03_full_tutorial.md
  - 04 Architecture: 04_architecture.md
  - 05 Configuration: 05_configuration.md
  - 06 Library Usage: 06_library_usage.md
  - Component Reference:
    - Frontends: components/frontends.md
    - Backends: components/backends.md
    - Losses: components/losses.md
    - Augmentations: components/augmentations.md
    - Optimizers & Schedulers: components/optimizers_schedulers.md
  - User Guides:
    - Training Workflow: user_guide/training.md
    - Inference: user_guide/inference.md
    - Extending DeepFense: user_guide/extending.md
